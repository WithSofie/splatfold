name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          inputs: .github/workflows
          version: "1.30.1"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check splatfold.py tests
      - run: ruff format --check splatfold.py tests
      - run: mypy splatfold.py
      - run: python -m coverage run -m pytest
      - run: python -m coverage report
      - run: python -m compileall -q splatfold.py

  platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[release]"
      - run: validate-pyproject pyproject.toml
      - run: python -m build
      - run: python -m twine check dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Test the wheel outside the source checkout
        run: |
          python -m venv /tmp/splatfold-wheel
          cd /tmp
          /tmp/splatfold-wheel/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/splatfold-wheel/bin/python -m pip check
          /tmp/splatfold-wheel/bin/splatfold --version
          /tmp/splatfold-wheel/bin/python -c "import pathlib, splatfold; assert pathlib.Path(splatfold.__file__).is_relative_to('/tmp/splatfold-wheel')"
          /tmp/splatfold-wheel/bin/python -c "import importlib.metadata, splatfold; assert importlib.metadata.version('splatfold') == splatfold.__version__"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
