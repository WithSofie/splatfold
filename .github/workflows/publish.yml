name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-to-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify release tag matches the package version
        run: >-
          python -c "import os, splatfold, sys;
          actual = os.environ['GITHUB_REF_NAME'];
          expected = f'v{splatfold.VERSION}';
          print(f'release tag: {actual}; expected: {expected}');
          sys.exit(actual != expected)"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,release]"
      - run: ruff check splatfold.py tests
      - run: ruff format --check splatfold.py tests
      - run: mypy splatfold.py
      - run: python -m coverage run -m pytest
      - run: python -m coverage report
      - run: validate-pyproject pyproject.toml
      - run: python -m build
      - run: python -m twine check dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Smoke-test the release wheel outside the source checkout
        run: |
          python -m venv /tmp/splatfold-release-wheel
          cd /tmp
          /tmp/splatfold-release-wheel/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/splatfold-release-wheel/bin/python -m pip check
          /tmp/splatfold-release-wheel/bin/splatfold --version
          /tmp/splatfold-release-wheel/bin/python -c "import pathlib, splatfold; assert pathlib.Path(splatfold.__file__).is_relative_to('/tmp/splatfold-release-wheel')"
          /tmp/splatfold-release-wheel/bin/python -c "import importlib.metadata, splatfold; assert importlib.metadata.version('splatfold') == splatfold.__version__"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/splatfold/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
